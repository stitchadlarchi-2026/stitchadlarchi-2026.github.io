# Baseline security headers for the STITCH exhibition site.
# `always` so they are set on error responses too, not just on a 200.
#
# The Content-Security-Policy here is deliberately permissive. Breeze owns the
# page content and edits it without touching this file; a policy tight enough to
# name today's exact origins would silently break the next thing she adds (an
# embedded map, a CDN image, a video). What it still buys, without ever getting
# in her way: the page cannot be framed, plugins cannot run, and a rewritten
# <base> cannot re-point every relative URL on the page.
# One canonical hostname. Cloudflare routes both the apex and www down the same
# tunnel, so without this the identical page answers on two addresses.
server {
    listen 80;
    listen [::]:80;
    server_name www.stitchexhibition.com;
    return 301 https://stitchexhibition.com$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;   # the container healthcheck hits `localhost`, which resolves to ::1 first
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version in the Server header.
    server_tokens off;

    add_header X-Frame-Options            "DENY"                                    always;
    add_header X-Content-Type-Options     "nosniff"                                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains"     always;
    add_header Content-Security-Policy    "default-src 'self' https: data:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Caching is set with `expires`, never with `add_header Cache-Control` inside
    # a location. nginx only inherits a parent's add_header directives when the
    # child declares none of its own -- one Cache-Control here would silently
    # drop every security header above for that one path.
    #
    # The page is baked into the image, so a redeploy is a new image and the old
    # bytes are gone. Assets may be cached; the HTML entry point must not be, or
    # a returning visitor keeps the page from before the deploy.
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|mp4|webm)$ {
        expires 30d;
    }
    location ~* \.html?$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # --- usage counting -----------------------------------------------------
    # nginx adds the beacon to every HTML page as it serves it, so the counting
    # lives here and not in Breeze's markup. The GitHub Pages copy of the site
    # does not get it, and does not need it.
    sub_filter '</body>' '<script src="/_u.js" defer></script></body>';
    sub_filter_once on;

    location = /_u.js {
        alias /usr/share/nginx/beacon.js;
        default_type application/javascript;
        expires 1h;
    }

    # Beacons go to the `usage` service. The name is resolved per request
    # through Docker's DNS, not once at startup, so nginx starts and serves the
    # page even when that service is down; the beacon then just gets a 204.
    location = /_u/e {
        limit_except POST { deny all; }
        client_max_body_size 1k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $usage http://usage:8080;
        proxy_pass $usage/e;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
        error_page 502 503 504 = @nobeacon;
    }
    location @nobeacon {
        return 204;
    }
}
