# Baseline security headers for the STITCH exhibition site.
# `always` so they are set on error responses too, not just on a 200.
#
# The Content-Security-Policy here is deliberately permissive. Breeze, the
# designer, edits the page without touching this file; a policy tight enough to
# name today's exact origins would silently break the next thing she adds (an
# embedded map, a CDN image, a video). What it still buys, without ever getting
# in her way: the page cannot be framed, plugins cannot run, and a rewritten
# <base> cannot re-point every relative URL on the page.
# One canonical hostname. Cloudflare routes both the apex and www down the same
# tunnel, so without this the identical page answers on two addresses.
server {
    listen 80;
    listen [::]:80;
    server_name www.stitchexhibition.com;
    return 301 https://stitchexhibition.com$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;   # the container healthcheck hits `localhost`, which resolves to ::1 first
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version in the Server header.
    server_tokens off;

    add_header X-Frame-Options            "DENY"                                    always;
    add_header X-Content-Type-Options     "nosniff"                                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains"     always;
    add_header Content-Security-Policy    "default-src 'self' https: data:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Caching is set with `expires`, never with `add_header Cache-Control` inside
    # a location. nginx only inherits a parent's add_header directives when the
    # child declares none of its own -- one Cache-Control here would silently
    # drop every security header above for that one path.
    #
    # The page is baked into the image, so a redeploy is a new image and the old
    # bytes are gone. Assets may be cached; the HTML entry point must not be, or
    # a returning visitor keeps the page from before the deploy.
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|mp4|webm)$ {
        expires 30d;
    }
    location ~* \.html?$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # --- usage counting -----------------------------------------------------
    # nginx adds the beacon to every HTML page as it serves it, so the counting
    # lives here and not in Breeze's markup. The GitHub Pages copy of the site
    # does not get it, and does not need it.
    sub_filter '</body>' '<script src="/_u.js" defer></script></body>';
    sub_filter_once on;

    location = /_u.js {
        alias /usr/share/nginx/beacon.js;
        default_type application/javascript;
        expires 1h;
    }

    # Beacons go to the `usage` service. The name is resolved per request
    # through Docker's DNS, not once at startup, so nginx starts and serves the
    # page even when that service is down; the beacon then just gets a 204.
    location = /_u/e {
        limit_except POST { deny all; }
        client_max_body_size 1k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $usage http://usage:8080;
        proxy_pass $usage/e;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
        error_page 502 503 504 = @nobeacon;
    }
    location @nobeacon {
        return 204;
    }

    # --- exhibition submissions -----------------------------------------------
    # The form sends only small JSON here: its details at /start, the parts'
    # ETags at /complete. The files themselves go from the browser straight to
    # R2 on presigned URLs, never through nginx, Cloudflare's 100 MB request
    # limit, or the home connection. Resolved per request like the usage
    # service, so the site still serves when `submissions` is down; the form
    # then gets a 503 and tells the person it could not send.
    location ~ ^/_s/(start|complete)$ {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $submissions http://submissions:8081;
        proxy_pass $submissions/$1;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        error_page 502 503 504 = @nosubmissions;
    }
    # The committee's downloads, behind SUBMISSIONS_KEY: /_s/export (the sheet
    # and headshots), /_s/export/posters (tens of GB, streamed as it is read),
    # and /_s/status (counts and the queue).
    location ~ ^/_s/(export|export/posters|status)$ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $submissions_admin http://submissions:9091;
        proxy_pass $submissions_admin/$1;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        access_log off;
        error_page 502 503 504 = @nosubmissions;
    }
    # The Student Directory: approved profiles, their headshot tiles and their
    # posters' web copies, public. The poster PNGs are never served.
    location = /_s/directory.json {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $submissions http://submissions:8081;
        proxy_pass $submissions/directory.json;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        access_log off;
        error_page 502 503 504 = @nosubmissions;
    }
    # Directory images end in .jpg so Cloudflare caches them at the
    # edge (the service sends max-age=300). `^~` because the site's own image
    # regex at the top would otherwise take any path ending in .jpg and look for
    # a file on disk.
    location ^~ /_s/media/ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $submissions http://submissions:8081;
        rewrite ^/_s(/media/[0-9a-f-]+/(?:photo|posterWeb)\.jpg)$ $1 break;
        return 404;
        proxy_pass $submissions;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        access_log off;
    }
    # The committee's review page for the directory, behind SUBMISSIONS_KEY:
    # the page, its thumbnails, and the approve and hide buttons.
    location ~ ^/_s/(review|review/media/[0-9a-f-]+/(?:photo|posterWeb)|review/[0-9a-f-]+/(?:approve|hide))$ {
        limit_except GET POST { deny all; }
        client_max_body_size 4k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $submissions_admin http://submissions:9091;
        proxy_pass $submissions_admin/$1;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        access_log off;
        error_page 502 503 504 = @nosubmissions;
    }
    location @nosubmissions {
        default_type application/json;
        return 503 '{"error":"Submissions are offline right now. Please try again soon."}';
    }
}
