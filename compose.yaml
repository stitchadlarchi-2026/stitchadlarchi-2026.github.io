# STITCH exhibition site — nginx serving the built image, plus this stack's own
# Cloudflare Tunnel. Self-contained per the house convention: one compose
# project per app, its own tunnel, its own network. Restarting this never
# touches another stack, even though several share a Cloudflare account.
#
#   docker compose -f compose.yaml -p stitch-exhibition --env-file .env up -d --build
#
# In normal operation nobody runs that by hand: a push to main on GitHub is the
# deploy. See deploy/README.md.

name: stitch-exhibition

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Loopback only. The tunnel reaches this service by name over the compose
    # network, so nothing needs to be published at all -- this port exists for
    # checking the site from the box itself, without going through Cloudflare.
    ports:
      - '${WEB_PORT:-127.0.0.1:8094}:80'

    # --- containment --------------------------------------------------------
    # Thirty containers share this box with other people's production stacks.
    # A runaway here must not become their outage.
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 128
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    # The image is a read-only document root; nginx only needs scratch space.
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    # Uploads to the exhibition form are spooled here before nginx hands them
    # on. On disk, not tmpfs: tmpfs counts against mem_limit, and one photo is
    # 20 MB. nginx deletes each file once the request is done.
    volumes:
      - web-body-temp:/var/lib/nginx-body
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Counts page views and clicks for the monitoring page. nginx forwards the
  # page's beacons here over the compose network; the counts are read by the
  # host collector on loopback. nginx does not depend on this service: if it is
  # down, beacons get a 204 and the page is unaffected. See deploy/usage/.
  usage:
    build:
      context: deploy/usage
    restart: unless-stopped
    ports:
      - '${USAGE_PORT:-127.0.0.1:9094}:9090'
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 64
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/usage >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Exhibition submissions: the form on the Links page posts here through
  # nginx, and the committee downloads everything as one zip (an Excel sheet
  # plus each headshot renamed after its person) from /_s/export, behind
  # SUBMISSIONS_KEY. Unlike `usage`, this one keeps data: it lives on the
  # `submissions-data` volume, so a redeploy or reboot keeps every submission.
  # nginx does not depend on it: if it is down, the page is unaffected and the
  # form says it could not send. See deploy/submissions/.
  submissions:
    build:
      context: deploy/submissions
    restart: unless-stopped
    environment:
      SUBMISSIONS_KEY: ${SUBMISSIONS_KEY:-}
      # Required: a public form without bot protection does not deploy.
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?set TURNSTILE_SECRET in .env}
    volumes:
      - submissions-data:/data
    # One 20 MB upload is parsed at a time (MAX_PARSING in server.mjs) and
    # peaks near 120 MB; the rest wait their turn rather than share this.
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9091/health >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  # nginx's upload spool. Scratch space only; safe to delete.
  web-body-temp:
  # Every exhibition submission and headshot. Back this up with the box; it is
  # the only thing in this stack that cannot be rebuilt from git.
  submissions-data:
