# The deploy signal for stitchexhibition.com.
#
# The house pipeline gates a deploy on a check suite: the poller on the server
# reads this commit's `site` check over GitHub's public API and refuses to
# deploy a commit whose check did not pass. Breeze designs the page and does not
# work on that server, so Bijin asked for a pipeline that never blocks her page
# edits: the site notes are advisory, reported in the job summary rather than as
# a red X.
#
# Two steps do block, and only for the server code under deploy/: the server
# code must parse and the images must build. Since 2026-11-25 the stack holds
# exhibition submissions, and a server that cannot start would lose them.
# Nothing in index.html or the assets can fail those steps.

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look over the site
        shell: bash {0}          # GitHub sets -e by default; this step must never fail
        run: |
          set +e
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, re, html.parser, pathlib

          notes, ok = [], []
          root = pathlib.Path(".")
          pages = sorted(p for p in root.rglob("*.html") if ".git" not in p.parts)

          if not pages:
              notes.append("No HTML page found in the repository.")

          class Parse(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title, self.in_title, self.refs, self.lang = "", False, [], None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "title": self.in_title = True
                  if tag == "html": self.lang = a.get("lang")
                  for k in ("href", "src"):
                      if a.get(k): self.refs.append(a[k])
              def handle_endtag(self, tag):
                  if tag == "title": self.in_title = False
              def handle_data(self, d):
                  if self.in_title: self.title += d

          DEFAULTS = {"vite", "react app", "create react app", "next.js", "document", ""}

          for page in pages:
              text = page.read_text(encoding="utf-8", errors="replace")
              p = Parse()
              p.feed(text)
              title = p.title.strip()
              ok.append(f"`{page}` — {len(text)//1024} KB")

              if title.lower() in DEFAULTS:
                  notes.append(f"`{page}` has no real `<title>` (found {title!r}).")
              if not p.lang:
                  notes.append(f"`{page}` has no `lang` on `<html>`.")

              # A local href/src that points at a file nobody committed still
              # renders; it is invisible until someone opens the network panel.
              for ref in p.refs:
                  if re.match(r"^(https?:|data:|mailto:|tel:|#|//)", ref):
                      continue
                  target = (page.parent / ref.split("?")[0].split("#")[0]).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      continue
                  if not target.exists():
                      notes.append(f"`{page}` points at `{ref}`, which is not in the repository.")

          print("## STITCH — site check\n")
          print("Advisory only. The notes below never fail a deploy.\n")
          print("### Pages\n")
          for line in ok: print(f"- {line}")
          print("\n### Notes\n")
          if notes:
              for n in notes: print(f"- {n}")
          else:
              print("- Nothing to report.")
          PY
          exit 0

      # The two steps below are the exception to "never fails". Since the
      # exhibition form, this stack holds people's submissions, and a server that
      # cannot start loses them until someone notices. So a commit whose server
      # code does not parse, or whose images do not build, does not deploy: the
      # server keeps running the last commit that did. Changes to index.html and
      # the site's assets can never fail these steps.
      - name: Server code parses
        run: |
          set -e
          for f in deploy/*/*.mjs; do
            node --check "$f"
            echo "- \`$f\` parses" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Images the server will build
        run: |
          set -e
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Docker images" >> "$GITHUB_STEP_SUMMARY"
          docker build -q -t stitch-check-web . > /dev/null
          docker build -q -t stitch-check-usage deploy/usage > /dev/null
          docker build -q -t stitch-check-submissions deploy/submissions > /dev/null
          echo "- web, usage and submissions all build." >> "$GITHUB_STEP_SUMMARY"
